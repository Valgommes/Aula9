name: Java CI Pipeline

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package

      - name: Run Unit Tests & Generate JaCoCo Report
        run: mvn test jacoco:report

      - name: Code Quality Check (Checkstyle)
        run: mvn checkstyle:check
        continue-on-error: false

      - name: OWASP Dependency-Check
        run: mvn org.owasp:dependency-check-maven:check -DnvdApiDelay=6000
        continue-on-error: true

      - name: SonarQube Scan (Quality Gate)
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  integration-tests:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Integration Tests
        run: mvn verify -Pintegration-tests

  deploy-staging:
    needs: [build-and-test, integration-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging
        run: echo "Todos os testes e verificações passaram. Realizando deploy para Staging..."