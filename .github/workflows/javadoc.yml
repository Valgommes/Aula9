name: Generate Javadoc

on:
  push:
    branches: [ main, develop ]

jobs:
  javadoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Generate Javadoc
        run: mvn javadoc:test-javadoc